<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE | $DECORATOR_TITLE">LifeStream</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- 引用优化后的样式表 -->
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <script th:src="@{/js/theme-switcher.js}"></script>
    <th:block layout:fragment="styles"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">

<header th:fragment="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-stream me-2"></i>LifeStream
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse align-items-center" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/posts}">文章</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tags}">标签</a>
                    </li>
                </ul>

                <!-- 搜索框：在移动端自动堆叠，PC端保持宽度 -->
                <form class="d-flex mx-lg-3 my-3 my-lg-0" th:action="@{/search}" method="get">
                    <div class="input-group input-group-sm" style="min-width: 200px;">
                        <input class="form-control border-0 bg-white bg-opacity-50" type="search"
                               name="keyword" placeholder="探索灵感..." aria-label="Search">
                        <button class="btn btn-light text-primary fw-bold" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>

                <ul class="navbar-nav align-items-center">
                    <li class="nav-item dropdown ms-lg-2" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:src="${#authentication.principal.avatarUrl != null ? #authentication.principal.avatarUrl : '/images/default-avatar.png'}"
                                 alt="User Avatar"
                                 class="user-avatar me-2 rounded-circle shadow-sm"
                                 style="width: 36px; height: 36px; object-fit: cover; border: 2px solid white;">
                            <span sec:authentication="name" class="fw-bold">Username</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="navbarDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/profile}">
                                    <i class="fas fa-user-astronaut"></i>我的空间
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/posts/new}">
                                    <i class="fas fa-pen-fancy"></i>发布动态
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" style="display: inline;">
                                    <button type="submit" class="dropdown-item" style="cursor: pointer; border: none; background: none; width: 100%; text-align: left;">
                                        <i class="fas fa-sign-out-alt me-2"></i>退出登录
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item ms-lg-2" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-outline-light text-dark fw-bold btn-sm me-2 rounded-pill px-3" th:href="@{/login}">登录</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-primary fw-bold btn-sm rounded-pill px-3 shadow-sm" th:href="@{/register}">注册</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="flex-grow-1">
    <!-- 移除了强制的 mt-4，改为由内部内容决定，以便首页 Hero 区域可以全宽展示 -->
    <div class="container-fluid main-content-fluid">
        <!-- 这里的 alert 应该做成 toast 或浮动提示更佳，保持原样但增加边距 -->
        <div id="alertContainer" class="container mt-3"></div>

        <th:block layout:fragment="content"></th:block>
    </div>
</main>

<footer th:fragment="site-footer" class="glass-footer mt-auto">
    <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
            <p class="mb-0 fw-bold">
                <i class="fas fa-stream me-2 text-primary"></i>
                © 2025 Starinova. <span class="fw-normal opacity-75">All Rights Reserved.</span>
            </p>
        </div>
        <div class="col-md-6 text-center text-md-end mt-2 mt-md-0">
            <div class="footer-links">
                <small>
                    Code with <i class="fas fa-heart text-danger mx-1"></i> &
                    <a class="text-decoration-underline" href="https://www.gnu.org/licenses/gpl-3.0.html">GNU GPLv3</a>
                </small>
            </div>
        </div>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<th:block layout:fragment="scripts"></th:block>

</body>
</html>
