<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>修改密码 - LifeStream</title>
</head>

<body>
<div layout:fragment="content" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <!-- Glass Card -->
            <div class="card animate-fade-in-up border-0">
                <div class="card-header bg-transparent border-0 pt-5 pb-2 text-center">
                    <h3 class="mb-0 fw-bold" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        <i class="fas fa-shield-alt me-2 text-primary"></i>修改密码
                    </h3>
                    <p class="text-muted small mt-2">定期更新密码，保护您的账户安全</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <!-- Error alert -->
                    <div th:if="${error}" class="alert alert-danger border-0 shadow-sm rounded-4 d-flex align-items-center mb-4" role="alert">
                        <i class="fas fa-exclamation-circle me-3 fs-4"></i>
                        <div><span th:text="${error}">错误消息</span></div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Success alert -->
                    <div th:if="${success}" class="alert alert-success border-0 shadow-sm rounded-4 d-flex align-items-center mb-4" role="alert">
                        <i class="fas fa-check-circle me-3 fs-4"></i>
                        <div><span th:text="${success}">成功消息</span></div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/profile/change-password}" method="post" id="passwordChangeForm" class="needs-validation" novalidate>

                        <div class="mb-4">
                            <label for="oldPassword" class="form-label fw-bold ms-1">当前密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control border-start-0" id="oldPassword" name="oldPassword" placeholder="输入现在的密码" required>
                                <button class="btn btn-toggle-password" type="button" onclick="togglePassword('oldPassword', this)">
                                    <i class="far fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label for="newPassword" class="form-label fw-bold ms-1">新密码</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" class="form-control border-start-0" id="newPassword" name="newPassword"
                                       placeholder="输入新密码" required minlength="6" maxlength="20">
                                <button class="btn btn-toggle-password" type="button" onclick="togglePassword('newPassword', this)">
                                    <i class="far fa-eye"></i>
                                </button>
                            </div>

                            <!-- 密码强度条 -->
                            <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                                <span class="small text-muted" id="strengthText">密码强度: 未输入</span>
                            </div>
                            <div class="password-strength-meter">
                                <div class="password-strength-bar" id="strengthBar"></div>
                            </div>
                        </div>

                        <!-- 密码要求列表 -->
                        <div class="mb-4 p-3 bg-light bg-opacity-50 rounded-4">
                            <ul class="password-requirements mb-0">
                                <li id="length-requirement">
                                    <i class="far fa-circle"></i>至少 6 个字符
                                </li>
                                <li id="letter-requirement">
                                    <i class="far fa-circle"></i>包含字母
                                </li>
                                <li id="number-requirement">
                                    <i class="far fa-circle"></i>包含数字
                                </li>
                                <li id="special-requirement" class="mb-0">
                                    <i class="far fa-circle"></i>包含特殊字符（建议）
                                </li>
                            </ul>
                        </div>

                        <div class="mb-5">
                            <label for="confirmPassword" class="form-label fw-bold ms-1">确认新密码</label>
                            <div class="input-group has-validation">
                                <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                                <input type="password" class="form-control border-start-0" id="confirmPassword" name="confirmPassword" placeholder="再次输入新密码" required>
                                <button class="btn btn-toggle-password" type="button" onclick="togglePassword('confirmPassword', this)">
                                    <i class="far fa-eye"></i>
                                </button>
                                <div class="invalid-feedback ms-1" id="password-match-feedback">
                                    两次输入的密码不一致
                                </div>
                            </div>
                        </div>

                        <!-- Form actions -->
                        <div class="d-flex justify-content-end gap-3 border-top border-light pt-3">
                            <a th:href="@{/profile}" class="btn btn-light px-4 fw-bold text-secondary">
                                取消
                            </a>
                            <button type="submit" class="btn btn-primary px-4 shadow hover-lift" id="submitButton">
                                <i class="fas fa-save me-2"></i>确认修改
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        // 将 toggle 函数暴露到全局，以便 onclick 调用
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        $(document).ready(function() {
            // Password strength meter
            $('#newPassword').on('input', function() {
                var password = $(this).val();
                updatePasswordStrength(password);
                checkPasswordMatch();
            });

            function updatePasswordStrength(password) {
                // Check requirements
                var hasLetter = /[A-Za-z]/.test(password);
                var hasNumber = /[0-9]/.test(password);
                var hasSpecial = /[^A-Za-z0-9]/.test(password);
                var isLongEnough = password.length >= 6;

                // Update requirement indicators
                updateRequirement('length-requirement', isLongEnough);
                updateRequirement('letter-requirement', hasLetter);
                updateRequirement('number-requirement', hasNumber);
                updateRequirement('special-requirement', hasSpecial);

                // Calculate strength
                var strength = 0;
                if (password.length > 0) {
                    if (password.length >= 6) strength += 25;
                    if (password.length >= 10) strength += 15;
                    if (hasLetter) strength += 20;
                    if (hasNumber) strength += 20;
                    if (hasSpecial) strength += 20;
                }

                // Update strength meter UI
                var $strengthBar = $('#strengthBar');
                var $strengthText = $('#strengthText');

                if (password.length === 0) {
                    $strengthBar.css({'width': '0%', 'background-color': '#e2e8f0'});
                    $strengthText.html('密码强度: <span class="text-muted">未输入</span>');
                } else if (strength < 40) {
                    $strengthBar.css({'width': strength + '%', 'background-color': 'var(--danger-color)'});
                    $strengthText.html('密码强度: <span class="text-danger fw-bold">弱</span>');
                } else if (strength < 70) {
                    $strengthBar.css({'width': strength + '%', 'background-color': 'var(--warning-color)'});
                    $strengthText.html('密码强度: <span class="text-warning fw-bold">中</span>');
                } else {
                    $strengthBar.css({'width': strength + '%', 'background-color': 'var(--success-color)'});
                    $strengthText.html('密码强度: <span class="text-success fw-bold">强</span>');
                }
            }

            function updateRequirement(id, isMet) {
                var $requirement = $('#' + id);
                var $icon = $requirement.find('i');

                if (isMet) {
                    $requirement.addClass('requirement-met').removeClass('requirement-not-met');
                    $icon.removeClass('far fa-circle').addClass('fas fa-check-circle');
                } else {
                    $requirement.removeClass('requirement-met');
                    // 如果是空输入，还原为圆圈；如果输入了但不满足，可以加高亮，这里简单还原
                    $icon.removeClass('fas fa-check-circle').addClass('far fa-circle');
                }
            }

            // Password match validation
            $('#confirmPassword').on('input', function() {
                checkPasswordMatch();
            });

            function checkPasswordMatch() {
                var newPassword = $('#newPassword').val();
                var confirmPassword = $('#confirmPassword').val();
                var $confirmInput = $('#confirmPassword');

                if (confirmPassword) {
                    if (newPassword !== confirmPassword) {
                        $confirmInput.addClass('is-invalid').removeClass('is-valid');
                        return false;
                    } else {
                        $confirmInput.removeClass('is-invalid').addClass('is-valid');
                        return true;
                    }
                } else {
                    $confirmInput.removeClass('is-invalid is-valid');
                }
                return true;
            }

            // Form validation
            $('#passwordChangeForm').on('submit', function(e) {
                if (!checkPasswordMatch()) {
                    e.preventDefault();
                    $('#confirmPassword').focus();
                    return;
                }

                var newPassword = $('#newPassword').val();
                var hasLetter = /[A-Za-z]/.test(newPassword);
                var hasNumber = /[0-9]/.test(newPassword);
                var isLongEnough = newPassword.length >= 6;

                if (!isLongEnough || !hasLetter || !hasNumber) {
                    e.preventDefault();
                    // 简单的抖动效果或提示
                    $('.password-requirements').addClass('animate__animated animate__shakeX'); // 需引入 animate.css，这里略过，只做逻辑拦截
                    alert('请确保新密码符合所有必填要求');
                }
            });
        });
    </script>
</th:block>

</body>
</html>
