<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>登录 - LifeStream</title>
</head>

<body>

<th:block layout:fragment="content">
    <div class="auth-container">
        <!-- 使用 animate-fade-in-up 增加进入动画 -->
        <div class="card auth-card animate-fade-in-up">
            <div class="card-body p-4 p-md-5">
                <div class="text-center">
                    <div class="auth-logo">
                        <i class="fas fa-fingerprint"></i>
                    </div>
                    <h3 class="fw-bold mb-1">欢迎回来</h3>
                    <p class="text-muted small mb-4">登录以继续您的 LifeStream 之旅</p>
                </div>

                <!-- 消息提示区域 -->
                <div th:if="${success}" class="alert alert-success border-0 shadow-sm rounded-3 d-flex align-items-center" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${param.error}" class="alert alert-danger border-0 shadow-sm rounded-3 d-flex align-items-center" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span>用户名或密码不正确</span>
                </div>
                <div th:if="${param.logout}" class="alert alert-info border-0 shadow-sm rounded-3 d-flex align-items-center" role="alert">
                    <i class="fas fa-info-circle me-2"></i>
                    <span>您已成功退出登录</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-bold ms-1">账号</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control form-control-lg border-start-0" id="username" name="username"
                                   placeholder="用户名 / 电子邮箱" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label fw-bold ms-1">密码</label>
                            <a th:href="@{/forgot-password}" class="small text-decoration-none text-primary fw-bold">忘记密码?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg border-start-0" id="password" name="password"
                                   placeholder="请输入密码" required>
                            <!-- 密码显隐切换按钮 -->
                            <button class="btn btn-toggle-password" type="button" onclick="toggleLoginPassword(this)">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-check form-switch ms-1">
                            <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me" style="cursor: pointer;">
                            <label class="form-check-label text-muted" for="rememberMe" style="cursor: pointer;">记住我的登录状态</label>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg shadow hover-lift">
                            <i class="fas fa-sign-in-alt me-2"></i>立即登录
                        </button>
                    </div>
                </form>

                <div class="auth-divider">或通过以下方式登录</div>

                <div class="d-flex justify-content-center gap-3 mb-4">
                    <a href="#" class="social-login-btn" title="微信登录"><i class="fab fa-weixin"></i></a>
                    <a href="#" class="social-login-btn" title="GitHub登录"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-login-btn" title="Google登录"><i class="fab fa-google"></i></a>
                </div>

                <div class="text-center pt-2 border-top border-light">
                    <p class="mb-0 text-muted">
                        还没有账号? <a th:href="@{/register}" class="text-decoration-none fw-bold text-primary">立即免费注册</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script>
        function toggleLoginPassword(btn) {
            const input = document.getElementById('password');
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</th:block>

</body>
</html>
