<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>注册 - LifeStream</title>
</head>

<body>

<th:block layout:fragment="content">
    <div class="auth-container">
        <div class="card auth-card animate-fade-in-up">
            <div class="card-body p-4 p-md-5">
                <div class="text-center">
                    <div class="auth-logo">
                        <i class="fas fa-rocket"></i>
                    </div>
                    <h3 class="fw-bold mb-1">加入 LifeStream</h3>
                    <p class="text-muted small mb-4">开启您的数字创作之旅，只需几秒钟</p>
                </div>

                <form th:action="@{/register}" th:object="${userDto}" method="post" id="registerForm" novalidate>

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger border-0 shadow-sm rounded-3" role="alert">
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <!-- 用户名 -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold ms-1">用户名</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control border-start-0" id="username"
                                   th:field="*{username}" placeholder="设置一个独特的用户名" required minlength="3" maxlength="40"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">

                            <div class="invalid-feedback" id="username-feedback"
                                 th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            <div class="invalid-feedback" id="username-ajax-feedback"></div>
                        </div>
                        <div class="form-text ms-1 small">3-40个字符，注册后不可轻易修改</div>
                    </div>

                    <!-- 邮箱 -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold ms-1">电子邮箱</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control border-start-0" id="email"
                                   th:field="*{email}" placeholder="name@example.com" required
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">

                            <div class="invalid-feedback" id="email-feedback"
                                 th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            <div class="invalid-feedback" id="email-ajax-feedback"></div>
                        </div>
                    </div>

                    <!-- 密码 -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold ms-1">密码</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control border-start-0" id="password"
                                   th:field="*{password}" placeholder="至少6位字符" required minlength="6" maxlength="20"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <button class="btn btn-toggle-password" type="button" id="togglePasswordBtn">
                                <i class="far fa-eye"></i>
                            </button>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <!-- 确认密码 -->
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-bold ms-1">确认密码</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                            <input type="password" class="form-control border-start-0" id="confirmPassword"
                                   name="confirmPassword" placeholder="再次输入密码" required minlength="6" maxlength="20"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                            <button class="btn btn-toggle-password" type="button" id="toggleConfirmPasswordBtn">
                                <i class="far fa-eye"></i>
                            </button>
                            <div class="invalid-feedback" id="password-match-feedback">两次输入的密码不一致</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <!-- 条款 -->
                    <div class="mb-4">
                        <div class="form-check ms-1">
                            <input type="checkbox" class="form-check-input" id="agreeTerms" th:field="*{agreeTerms}" required
                                   th:classappend="${#fields.hasErrors('agreeTerms')} ? 'is-invalid' : ''" style="cursor: pointer;">
                            <label class="form-check-label text-muted small" for="agreeTerms" style="cursor: pointer;">
                                我已阅读并同意 <a th:href="@{/terms}" target="_blank" class="text-primary text-decoration-none fw-bold">服务条款</a> 和 <a th:href="@{/privacy}" target="_blank" class="text-primary text-decoration-none fw-bold">隐私政策</a>
                            </label>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('agreeTerms')}" th:errors="*{agreeTerms}">
                                您必须同意条款才能注册
                            </div>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg shadow hover-lift">
                            <i class="fas fa-user-plus me-2"></i>立即注册
                        </button>
                    </div>
                </form>

                <div class="mt-4 text-center border-top border-light pt-3">
                    <p class="mb-0 text-muted">已有账号? <a th:href="@{/login}" class="text-decoration-none fw-bold text-primary">直接登录</a></p>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script>
        $(document).ready(function() {

            // 封装一个函数来处理 AJAX 验证
            function checkAvailability(inputElement, feedbackElement, url, paramName) {
                let value = inputElement.val();
                let params = {};
                params[paramName] = value;

                // 简单的防抖，防止频繁请求（可选，这里保持简单直接请求）
                $.get(url, params, function(response) {
                    if (!response.available) {
                        inputElement.addClass('is-invalid');
                        inputElement.removeClass('is-valid');
                        feedbackElement.text(response.message || '该值已被占用').show();
                    } else {
                        // 仅当没有服务端错误时才移除 is-invalid
                        // 注意：这里我们使用 nextAll 查找非 th:errors 的 feedback，因为 th:errors 是服务端渲染的
                        // 但为了简化，如果可用，我们尝试清除 invalid 状态
                        if (!inputElement.siblings('.invalid-feedback[th\\:errors]').length) {
                            inputElement.removeClass('is-invalid');
                            inputElement.addClass('is-valid'); // 可选：显示绿色对勾
                            feedbackElement.hide();
                        }
                    }
                }).fail(function() {
                    console.error("Availability check failed for: " + paramName);
                });
            }

            // 用户名实时验证
            $('#username').on('blur', function() {
                let username = $(this).val();
                if (username.length >= 3) {
                    checkAvailability($(this), $('#username-ajax-feedback'), '/api/user/checkUsernameAvailability', 'username');
                }
            });

            // 邮箱实时验证
            $('#email').on('blur', function() {
                let email = $(this).val();
                if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    checkAvailability($(this), $('#email-ajax-feedback'), '/api/user/checkEmailAvailability', 'email');
                }
            });

            // 密码显示/隐藏 (通用函数)
            function toggleVisibility(inputSelector, btnSelector) {
                const input = $(inputSelector);
                const icon = $(btnSelector).find('i');
                if (input.attr('type') === 'password') {
                    input.attr('type', 'text');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    input.attr('type', 'password');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            }

            $('#togglePasswordBtn').click(function() {
                toggleVisibility('#password', this);
            });

            $('#toggleConfirmPasswordBtn').click(function() {
                toggleVisibility('#confirmPassword', this);
            });

            // 密码匹配验证
            const password = $('#password');
            const confirmPassword = $('#confirmPassword');
            const matchFeedback = $('#password-match-feedback');

            function validatePasswordMatch() {
                if (password.val() && confirmPassword.val()) {
                    if (password.val() !== confirmPassword.val()) {
                        confirmPassword.addClass('is-invalid');
                        confirmPassword.removeClass('is-valid');
                        matchFeedback.show();
                        return false;
                    } else {
                        confirmPassword.removeClass('is-invalid');
                        confirmPassword.addClass('is-valid');
                        matchFeedback.hide();
                        return true;
                    }
                }
                return true;
            }

            confirmPassword.on('input', validatePasswordMatch);
            password.on('input', function() {
                if (confirmPassword.val()) validatePasswordMatch();
            });

            // 表单提交验证
            $('#registerForm').on('submit', function(e) {
                let isValid = true;

                if (!validatePasswordMatch()) isValid = false;
                if ($('#username').hasClass('is-invalid')) isValid = false;
                if ($('#email').hasClass('is-invalid')) isValid = false;
                if (!$('#agreeTerms').is(':checked')) {
                    $('#agreeTerms').addClass('is-invalid');
                    isValid = false;
                }

                if (!isValid) {
                    e.preventDefault();
                    // 简单的震动提示效果
                    $('.auth-card').addClass('animate__animated animate__shakeX');
                    setTimeout(() => $('.auth-card').removeClass('animate__animated animate__shakeX'), 1000);
                }
            });

            // 输入时移除错误状态
            $('input').on('input', function() {
                if ($(this).hasClass('is-invalid') && $(this).attr('id') !== 'confirmPassword') {
                    $(this).removeClass('is-invalid');
                }
                if ($(this).attr('type') === 'checkbox') {
                    $(this).removeClass('is-invalid');
                }
            });
        });
    </script>
</th:block>

</body>
</html>
