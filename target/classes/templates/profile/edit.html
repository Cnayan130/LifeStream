<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>编辑个人资料 - LifeStream</title>
</head>

<body>

<div layout:fragment="content" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- 使用 Glass 卡片样式，并添加进入动画 -->
            <div class="card animate-fade-in-up border-0">
                <div class="card-header bg-transparent border-0 pt-5 pb-2 text-center">
                    <h3 class="mb-0 fw-bold" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        <i class="fas fa-user-edit me-2 text-primary"></i>编辑资料
                    </h3>
                    <p class="text-muted small mt-2">完善您的个人信息，让大家更了解你</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <!-- 消息提示框优化为圆角柔和风格 -->
                    <div th:if="${error}" class="alert alert-danger border-0 shadow-sm rounded-4 d-flex align-items-center mb-4" role="alert">
                        <i class="fas fa-exclamation-circle me-3 fs-4"></i>
                        <div>
                            <span th:text="${error}">错误消息</span>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${success}" class="alert alert-success border-0 shadow-sm rounded-4 d-flex align-items-center mb-4" role="alert">
                        <i class="fas fa-check-circle me-3 fs-4"></i>
                        <div>
                            <span th:text="${success}">成功消息</span>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>

                        <!-- 头像上传区域优化 -->
                        <div class="text-center mb-5">
                            <div class="avatar-upload-wrapper">
                                <label for="avatarFile" class="d-block cursor-pointer">
                                    <img id="avatarPreview"
                                         th:src="${user.avatarUrl != null ? user.avatarUrl : '/images/default-avatar.png'}"
                                         class="rounded-circle shadow border border-4 border-white object-fit-cover"
                                         style="width: 120px; height: 120px;"
                                         alt="头像预览">

                                    <!-- 悬浮遮罩层 (样式在 style.css 中定义) -->
                                    <div class="avatar-upload-overlay">
                                        <div class="text-center">
                                            <i class="fas fa-camera fa-2x mb-1"></i>
                                            <div class="small fw-bold">更换</div>
                                        </div>
                                    </div>
                                </label>
                                <input type="file" id="avatarFile" name="avatarFile" accept="image/*" class="d-none">
                            </div>
                            <div class="mt-3 text-muted small">
                                <i class="fas fa-info-circle me-1"></i>支持 JPG/PNG，最大 5MB
                            </div>
                        </div>

                        <!-- 表单输入区域 -->
                        <div class="mb-4">
                            <label for="username" class="form-label fw-bold ms-1">用户名</label>
                            <div class="input-group has-validation">
                                <span class="input-group-text"><i class="fas fa-at"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username"
                                       th:value="${user.username}" required minlength="3" maxlength="40"
                                       placeholder="设置一个响亮的昵称">
                                <div class="invalid-feedback" id="username-feedback">
                                    用户名必填且不能重复
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label fw-bold ms-1">电子邮箱</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0 text-muted" id="email" th:value="${user.email}" readonly>
                            </div>
                            <div class="form-text ms-1 mt-2">
                                <i class="fas fa-lock me-1 small opacity-50"></i>为了账号安全，邮箱暂不支持直接修改
                            </div>
                        </div>

                        <div class="mb-5">
                            <div class="d-flex justify-content-between">
                                <label for="bio" class="form-label fw-bold ms-1">个人简介</label>
                                <span class="text-muted small"><span id="bioCharCount">0</span>/500</span>
                            </div>
                            <textarea class="form-control" id="bio" name="bio" rows="4"
                                      placeholder="写点什么介绍一下你自己，让更多人认识你..."
                                      maxlength="500" th:text="${user.bio}"></textarea>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="d-flex justify-content-end gap-3 pt-3 border-top border-light">
                            <a th:href="@{/profile}" class="btn btn-light px-4 fw-bold text-secondary">
                                取消
                            </a>
                            <button type="submit" class="btn btn-primary px-5 shadow hover-lift">
                                <i class="fas fa-save me-2"></i>保存更改
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        $(document).ready(function() {
            // 1. 头像预览逻辑
            $('#avatarFile').change(function() {
                if (this.files && this.files[0]) {
                    var file = this.files[0];

                    // 文件大小检查 (5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        // 这里使用 Bootstrap 的 Toast 或简单的 alert 都可以，为了统一暂用 alert
                        alert('文件过大，请选择小于 5MB 的图片');
                        this.value = '';
                        return;
                    }

                    // 文件类型检查
                    if (!file.type.match('image/(jpeg|jpg|png|gif)')) {
                        alert('请选择有效的图片文件 (JPG, PNG 或 GIF)');
                        this.value = '';
                        return;
                    }

                    var reader = new FileReader();
                    reader.onload = function(e) {
                        $('#avatarPreview').attr('src', e.target.result);
                    }
                    reader.readAsDataURL(file);
                }
            });

            // 2. 简介字数统计
            function updateBioCounter() {
                var charCount = $('#bio').val().length;
                $('#bioCharCount').text(charCount);

                if (charCount >= 500) {
                    $('#bioCharCount').addClass('text-danger fw-bold');
                } else {
                    $('#bioCharCount').removeClass('text-danger fw-bold');
                }
            }
            $('#bio').on('input', updateBioCounter);
            // 初始化计数
            updateBioCounter();

            // 3. 用户名实时查重 (防抖优化)
            let checkTimer;
            const currentUsername = [[${user.username}]];
            const $usernameInput = $('#username');
            const $usernameFeedback = $('#username-feedback');

            $usernameInput.on('input', function() {
                clearTimeout(checkTimer);
                const username = $(this).val();

                // 重置状态
                $(this).removeClass('is-invalid is-valid');

                if (username.length < 3) {
                    return;
                }

                if (username === currentUsername) {
                    return;
                }

                // 延迟 500ms 后发送请求
                checkTimer = setTimeout(function() {
                    $.get('/api/user/checkUsernameAvailability?username=' + username)
                        .done(function(response) {
                            if (!response.available) {
                                $usernameInput.addClass('is-invalid');
                                $usernameFeedback.text('该用户名已被占用');
                            } else {
                                $usernameInput.addClass('is-valid');
                                // 可以选择不显示 valid 状态，保持界面简洁，或者显示一个绿色勾选
                            }
                        })
                        .fail(function() {
                            console.error("用户名检查失败");
                        });
                }, 500);
            });
        });
    </script>
</th:block>

</body>
</html>
