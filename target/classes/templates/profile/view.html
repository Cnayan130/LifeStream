<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"> <head>
    <title th:text="${user.username} + ' 的个人资料 - LifeStream'">用户个人资料 - LifeStream</title>
</head>

<body>
<div layout:fragment="content" class="container pb-5">

    <!-- 个人资料头部卡片 -->
    <div class="card profile-card mb-5 animate-fade-in-up">
        <div class="d-flex align-items-center flex-md-row flex-column w-100">
            <!-- 头像区域 -->
            <div class="profile-avatar-container me-md-5 mb-4 mb-md-0">
                <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}"
                     class="profile-avatar rounded-circle object-fit-cover"
                     th:alt="${user.username} + '的头像'">
                <img th:unless="${user.avatarUrl}" th:src="@{/images/default-avatar.png}"
                     class="profile-avatar rounded-circle object-fit-cover"
                     alt="默认头像">
            </div>

            <!-- 信息区域 -->
            <div class="profile-info flex-grow-1 text-center text-md-start">
                <div class="d-flex align-items-center justify-content-center justify-content-md-start mb-2">
                    <h1 class="profile-username fw-bold mb-0 me-3" th:text="${user.username}">用户名</h1>
                    <span th:if="${isOwnProfile}" class="badge bg-primary bg-opacity-10 text-primary rounded-pill">我</span>
                </div>

                <p class="text-muted mb-3 small">
                    <span class="d-inline-flex align-items-center me-3">
                        <i class="far fa-envelope me-2 text-primary opacity-50"></i>
                        <span th:text="${user.email}">email@example.com</span>
                    </span>
                    <span class="d-inline-flex align-items-center">
                        <i class="far fa-calendar-alt me-2 text-primary opacity-50"></i>
                        <span>加入于 <span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2023-01-01</span></span>
                    </span>
                </p>

                <p th:if="${user.bio}" class="profile-bio mb-4 text-dark opacity-75" th:text="${user.bio}">用户简介</p>
                <p th:unless="${user.bio}" class="profile-bio text-muted mb-4 fst-italic opacity-50">这个用户很懒，还没有填写个人简介...</p>

                <!-- 统计数据 -->
                <div class="profile-stats d-flex justify-content-center justify-content-md-start mb-4">
                    <div class="stat-item me-5 text-center">
                        <div class="stat-value" th:text="${postCount}">0</div>
                        <div class="stat-label text-secondary">文章</div>
                    </div>
                    <div class="stat-item me-5 text-center">
                        <div class="stat-value" th:text="${albumCount}">0</div>
                        <div class="stat-label text-secondary">相册</div>
                    </div>
                    <div class="stat-item text-center">
                        <div class="stat-value" th:text="${imageCount}">0</div>
                        <div class="stat-label text-secondary">图片</div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="profile-actions" th:if="${isOwnProfile}">
                    <a th:href="@{/profile/edit}" class="btn btn-primary rounded-pill px-4 shadow-sm me-2">
                        <i class="fas fa-edit me-2"></i>编辑资料
                    </a>
                    <a th:href="@{/profile/change-password}" class="btn btn-light text-secondary rounded-pill px-4 border shadow-sm hover-lift">
                        <i class="fas fa-key me-2"></i>修改密码
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 导航 Tabs -->
    <div class="d-flex justify-content-center">
        <nav class="nav-glass mb-4">
            <div class="nav nav-tabs border-0" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-posts-tab" data-bs-toggle="tab" data-bs-target="#nav-posts"
                        type="button" role="tab" aria-controls="nav-posts" aria-selected="true">
                    <i class="fas fa-feather-alt me-2"></i>我的文章
                </button>
                <button class="nav-link" id="nav-albums-tab" data-bs-toggle="tab" data-bs-target="#nav-albums"
                        type="button" role="tab" aria-controls="nav-albums" aria-selected="false">
                    <i class="fas fa-images me-2"></i>相册集
                </button>
            </div>
        </nav>
    </div>

    <div class="tab-content" id="nav-tabContent">
        <!-- 文章 Tab 内容 -->
        <div class="tab-pane fade show active" id="nav-posts" role="tabpanel" aria-labelledby="nav-posts-tab">
            <!-- 空状态 -->
            <div th:if="${#lists.isEmpty(posts.content)}" class="card text-center py-5 border-0 bg-transparent">
                <div class="mb-3 text-secondary opacity-25"><i class="far fa-file-alt fa-4x"></i></div>
                <h5 class="text-muted fw-normal">暂无文章</h5>
                <p class="small text-muted mb-4" th:if="${isOwnProfile}">记录生活，从第一篇文章开始</p>
                <div th:if="${isOwnProfile}">
                    <a th:href="@{/posts/new}" class="btn btn-outline-primary rounded-pill px-4">
                        <i class="fas fa-pen me-2"></i>开始创作
                    </a>
                </div>
            </div>

            <div th:unless="${#lists.isEmpty(posts.content)}" class="posts-container">
                <div class="row row-cols-1 row-cols-md-2 g-4">
                    <div class="col" th:each="post : ${posts.content}">
                        <div class="card h-100 shadow-sm border-0 hover-shadow transition-all">
                            <div th:if="${isOwnProfile && !post.published}" class="position-absolute top-0 end-0 m-3 badge bg-warning text-dark z-index-1 shadow-sm">
                                <i class="fas fa-eye-slash me-1"></i>草稿
                            </div>

                            <a th:href="@{'/posts/' + ${post.id}}" class="text-decoration-none text-dark position-relative overflow-hidden rounded-top">
                                <div class="ratio ratio-16x9">
                                    <img th:if="${post.coverImage}" th:src="${post.coverImage}" class="object-fit-cover card-img-top" th:alt="${post.title}">
                                    <img th:unless="${post.coverImage}" th:src="@{/images/default-post.jpg}" class="object-fit-cover card-img-top opacity-75" alt="默认封面">
                                </div>
                            </a>

                            <div class="card-body d-flex flex-column p-4">
                                <div class="small text-muted mb-2 d-flex align-items-center">
                                    <i class="far fa-calendar-alt me-2"></i>
                                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></span>
                                </div>
                                <h5 class="card-title fw-bold text-truncate mb-3">
                                    <a th:href="@{'/posts/' + ${post.id}}" class="text-decoration-none text-dark stretched-link" th:text="${post.title}">标题</a>
                                </h5>
                                <p class="card-text text-muted small flex-grow-1 multi-line-truncate mb-4"
                                   th:text="${post.summary ?: (post.content != null ? #strings.abbreviate(#strings.unescapeJava(#strings.replace(#strings.replace(post.content, '<[^>]*>', ''), '&[^;]+;', ' ')), 80) : '无摘要')}">
                                    摘要
                                </p>
                                <div class="mt-auto d-flex justify-content-between align-items-center border-top pt-3 border-light">
                                    <div class="tags">
                                        <span class="badge bg-light text-secondary border me-1" th:each="tag : ${post.tags}" th:text="${'#'+tag}">Tag</span>
                                    </div>
                                    <div th:if="${isOwnProfile}" class="position-relative z-index-2">
                                        <a th:href="@{'/posts/' + ${post.id} + '/edit'}" class="btn btn-sm btn-light text-primary rounded-circle shadow-sm" title="编辑">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 分页 (样式优化) -->
                <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-5">
                    <ul class="pagination justify-content-center">
                        <li th:class="${currentPage == 0} ? 'page-item disabled' : 'page-item'">
                            <a class="page-link rounded-circle mx-1 border-0 shadow-sm" th:href="@{'/profile/' + ${user.username}(page=${currentPage - 1})}" aria-label="Previous">
                                <i class="fas fa-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:class="${i == currentPage} ? 'page-item active' : 'page-item'">
                            <a class="page-link rounded-circle mx-1 border-0 shadow-sm"
                               th:href="@{'/profile/' + ${user.username}(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li th:class="${currentPage == totalPages - 1} ? 'page-item disabled' : 'page-item'">
                            <a class="page-link rounded-circle mx-1 border-0 shadow-sm" th:href="@{'/profile/' + ${user.username}(page=${currentPage + 1})}" aria-label="Next">
                                <i class="fas fa-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- 相册 Tab 内容 -->
        <div class="tab-pane fade" id="nav-albums" role="tabpanel" aria-labelledby="nav-albums-tab">
            <!-- 空状态 -->
            <div th:if="${#lists.isEmpty(albums)}" class="card text-center py-5 border-0 bg-transparent">
                <div class="mb-3 text-secondary opacity-25"><i class="far fa-images fa-4x"></i></div>
                <h5 class="text-muted fw-normal">暂无相册</h5>
                <p class="small text-muted mb-4" th:if="${isOwnProfile}">创建属于你的第一个云端相册</p>
                <div th:if="${isOwnProfile}">
                    <a th:href="@{/albums/new}" class="btn btn-outline-primary rounded-pill px-4">
                        <i class="fas fa-plus me-2"></i>创建相册
                    </a>
                </div>
            </div>

            <div th:unless="${#lists.isEmpty(albums)}" class="albums-container">
                <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                    <div class="col" th:each="album : ${albums}">
                        <div class="card h-100 border-0 shadow-sm hover-shadow transition-all">
                            <div class="ratio ratio-1x1 bg-light rounded-top overflow-hidden position-relative group">
                                <img th:if="${album.imageCount > 0}" th:src="@{'/api/albums/' + ${album.id} + '/cover'}"
                                     class="object-fit-cover card-img-top transition-transform duration-500 hover-scale" alt="封面">
                                <div th:unless="${album.imageCount > 0}" class="d-flex align-items-center justify-content-center h-100 text-secondary opacity-50">
                                    <i class="fas fa-camera fa-2x"></i>
                                </div>
                                <a th:href="@{'/albums/' + ${album.id}}" class="stretched-link"></a>

                                <!-- 悬浮显示的遮罩信息 -->
                                <div class="position-absolute bottom-0 start-0 w-100 p-3 bg-gradient-dark-transparent text-white opacity-0 hover-opacity-100 transition-opacity">
                                    <small><i class="fas fa-eye me-1"></i>查看详情</small>
                                </div>
                            </div>
                            <div class="card-body p-3 text-center">
                                <h6 class="card-title text-truncate mb-2 fw-bold" th:text="${album.name}">相册名</h6>
                                <div class="d-flex justify-content-between align-items-center small px-2">
                                    <span class="text-primary bg-primary bg-opacity-10 px-2 py-1 rounded-pill">
                                        <i class="fas fa-image me-1"></i><span th:text="${album.imageCount}">0</span>
                                    </span>
                                    <span class="text-muted opacity-75" th:text="${#temporals.format(album.createdAt, 'yyyy-MM-dd')}">Date</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-5" th:if="${isOwnProfile}">
                    <a th:href="@{/albums/new}" class="btn btn-light text-primary rounded-pill shadow-sm border px-4 hover-lift">
                        <i class="fas fa-plus me-2"></i>创建新相册
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
